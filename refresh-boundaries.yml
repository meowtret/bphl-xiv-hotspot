name: Refresh Boundaries dari Supabase

# Manual saja -- jalankan lewat tab "Actions" tiap kali boundary di Supabase berubah.
# Tidak berjalan otomatis harian.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch boundaries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python scripts/fetch_boundaries.py

      - name: Commit & push boundary terbaru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/boundaries.geojson
          git diff --quiet --cached || git commit -m "chore: refresh boundaries from Supabase"
          git push
